[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-debate"
version = "1.0.0"
description = "CLI and Streamlit debates between Ollama models (Socrates vs Machiavelli) with a judge."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ollama>=0.6.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "pytest>=7.0",
    "streamlit>=1.33.0",
]

[project.scripts]
ollama-debate = "cli:main"

[tool.setuptools]
py-modules = ["arena", "cli", "app"]
